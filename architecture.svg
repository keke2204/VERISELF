<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2"/>

  <!-- Step 1: Input -->
  <g transform="translate(40, 60)">
    <rect width="180" height="340" rx="12" fill="#121316" stroke="#27272a" stroke-width="1.5"/>
    <rect x="20" y="20" width="140" height="28" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <text x="90" y="38" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">1. INGESTION</text>
    <text x="90" y="80" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Identity Media</text>
    <text x="90" y="105" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Portrait / ID Photos</text>

    <!-- Sub items -->
    <rect x="18" y="140" width="144" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="165" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="11">PNG • JPEG • WebP</text>

    <rect x="18" y="195" width="144" height="56" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="218" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Anatomical Landmarks</text>
    <text x="28" y="238" fill="#71717a" font-family="ui-monospace, monospace" font-size="10">5 Target Facial Points</text>

    <rect x="18" y="265" width="144" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="290" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11">Local Buffer Decoded</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M225 230 L265 230" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="265,226 273,230 265,234" fill="#10b981"/>

  <!-- Step 2: Processing & Perceptual Vault -->
  <g transform="translate(280, 60)">
    <rect width="200" height="340" rx="12" fill="#121316" stroke="#27272a" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="28" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <text x="100" y="38" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">2. PERCEPTUAL VAULT</text>
    <text x="100" y="80" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Multi-Hash Analysis</text>
    <text x="100" y="105" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Biometric Vectorization</text>

    <rect x="18" y="130" width="164" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="155" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">pHash • dHash • aHash</text>

    <rect x="18" y="180" width="164" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="205" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">wHash (Haar Wavelet)</text>

    <rect x="18" y="230" width="164" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="255" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="11">512-D ArcFace Vectors</text>

    <rect x="18" y="280" width="164" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="305" fill="#10b981" font-family="ui-monospace, monospace" font-size="11">Laplacian Edge Variance</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M485 230 L525 230" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="525,226 533,230 525,234" fill="#38bdf8"/>

  <!-- Step 3: Adversarial Cloaking -->
  <g transform="translate(540, 60)">
    <rect width="180" height="340" rx="12" fill="#121316" stroke="#27272a" stroke-width="1.5"/>
    <rect x="20" y="20" width="140" height="28" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <text x="90" y="38" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">3. ADVERSARIAL SHIELD</text>
    <text x="90" y="80" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Adaptive Cloaking</text>
    <text x="90" y="105" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Texture-Aware Noise</text>

    <rect x="18" y="140" width="144" height="46" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="162" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Gradient Noise</text>
    <text x="28" y="178" fill="#71717a" font-family="ui-monospace, monospace" font-size="10">High-frequency bands</text>

    <rect x="18" y="195" width="144" height="46" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="217" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cosine Shift &gt; 0.45</text>
    <text x="28" y="233" fill="#71717a" font-family="ui-monospace, monospace" font-size="10">Scraper disruption</text>

    <rect x="18" y="250" width="144" height="46" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="28" y="272" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">C2PA Manifest</text>
    <text x="28" y="288" fill="#71717a" font-family="ui-monospace, monospace" font-size="10">Cryptographic proof</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M725 230 L755 230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="755,226 763,230 755,234" fill="#f59e0b"/>

  <!-- Step 4: Output & Enforcement -->
  <g transform="translate(770, 60)">
    <rect width="150" height="340" rx="12" fill="#121316" stroke="#27272a" stroke-width="1.5"/>
    <rect x="15" y="20" width="120" height="28" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <text x="75" y="38" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">4. OUTPUT</text>
    <text x="75" y="80" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Defense Suite</text>
    <text x="75" y="105" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Protected Assets</text>

    <rect x="14" y="140" width="122" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="20" y="165" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10">Cloaked PNG</text>

    <rect x="14" y="190" width="122" height="42" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="20" y="215" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">Watermark PNG</text>

    <rect x="14" y="240" width="122" height="52" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="20" y="262" fill="#ec4899" font-family="system-ui, sans-serif" font-size="10" font-weight="600">17 U.S.C. § 512</text>
    <text x="20" y="280" fill="#71717a" font-family="ui-monospace, monospace" font-size="9">DMCA Notice</text>
  </g>
</svg>
