name: Live VeriSelf Browser Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 45

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Verify live browser to backend flow
        run: node .github/live-integration-test.cjs
